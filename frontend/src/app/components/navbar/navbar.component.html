<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" routerLink="/home" (click)="isCollapsed = true">
      MEMEMUSEUM
    </a>

    <!-- Pulsante hamburger -->
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNav"
            (click)="isCollapsed = !isCollapsed">&#9776;
    </button>

    <!-- Link Navbar-->
    <div class="collapse navbar-collapse" [class.show]="!isCollapsed" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link"
             routerLink="/meme-of-the-day"
             routerLinkActive="active"
             (click)="isCollapsed = true">Meme del Giorno</a>
        </li>
        @if (authService.isAuthenticated()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/upload" routerLinkActive="active"
                (click)="isCollapsed = true">Carica</a>
          </li>
        }
      </ul>

      <ul class="navbar-nav">
        @if (authService.isAuthenticated()) {
          <li class="nav-item">
            <span class="nav-link user fw-bold">
              {{ (authService.currentUser$ | async)?.username }}
            </span>
          </li>
          <li class="nav-item">
            <a class="nav-link clickable" (click)="onLogout()">Logout</a>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active"
              (click)="isCollapsed = true">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active"
              (click)="isCollapsed = true">Registrati</a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
